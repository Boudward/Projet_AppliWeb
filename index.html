<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demandes d'intervention</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 1000px; margin: 20px auto; padding: 0 10px; }
    input, select, textarea { display: block; margin: 6px 0; padding: 6px; width: 100%; max-width: 400px; box-sizing: border-box; }
    button { cursor: pointer; width: auto; padding: 6px 10px; margin: 2px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: left; vertical-align: top; }
    tr.ligne { cursor: pointer; }
    tr.ligne:hover { background: #f3f7ff; }
    tr.detail td { background: #fafafa; }
    .erreur { color: red; }
    .badge { padding: 2px 8px; border-radius: 10px; font-size: 12px; background: #eee; white-space: nowrap; }
    .refusee { background: #ffd6d6; }
    .termine { background: #d6ffd9; }
    .en_cours { background: #fff3c4; }
    .a_affecter { background: #d6e8ff; }
    .a_traiter { background: #e8d6ff; }
    #bandeau { margin-bottom: 15px; }
  </style>
</head>
<body>
  <h1>Demandes d'intervention</h1>

  <!-- CONNEXION -->
  <div id="vue-connexion">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="mdp" placeholder="Mot de passe">
    <button onclick="connexion()">Se connecter</button>
    <p id="msg-connexion" class="erreur"></p>
  </div>

  <!-- APPLICATION -->
  <div id="vue-app" style="display:none">
    <div id="bandeau">
      Connecté : <strong id="qui"></strong> (<span id="role"></span>)
      <button onclick="deconnexion()">Déconnexion</button>
    </div>

    <h2>Nouvelle demande</h2>
    <input type="text" id="titre" placeholder="Titre (obligatoire)">
    <textarea id="description" rows="3" placeholder="Description"></textarea>
    <input type="text" id="lieu" placeholder="Lieu">
    <select id="priorite">
      <option value="basse">Basse</option>
      <option value="normale" selected>Normale</option>
      <option value="haute">Haute</option>
      <option value="urgente">Urgente</option>
    </select>
    <button onclick="creer()">Envoyer la demande</button>

    <h2>Demandes</h2>
    <table>
      <thead>
        <tr><th>Titre</th><th>Lieu</th><th>Priorité</th><th>Statut</th><th>Créée le</th></tr>
      </thead>
      <tbody id="liste"></tbody>
    </table>
  </div>

<script>
  // À ADAPTER : vos identifiants Supabase
  const SUPABASE_URL = 'https://iflehvsemyyyofkwpezv.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_TupRcFtwtofGhLlz8hwVxg_O8xAQzTx';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let monRole = null;
  let ouvert = null; // id de la ligne dont le détail est affiché

  const LIBELLES = {
    a_affecter: 'À affecter', a_traiter: 'À traiter', en_cours: 'En cours',
    termine: 'Terminé', refusee: 'Refusée', archivee: 'Archivée'
  };

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c =>
      ({ '&': '&', '<': '<', '>': '>', '"': '"', "'": ''' }[c]));
  }

  // ---------- Connexion ----------
  async function connexion() {
    const { error } = await db.auth.signInWithPassword({
      email: document.getElementById('email').value,
      password: document.getElementById('mdp').value
    });
    if (error) { document.getElementById('msg-connexion').textContent = error.message; return; }
    demarrer();
  }

  async function deconnexion() {
    await db.auth.signOut();
    location.reload();
  }

  async function demarrer() {
    const { data: { user } } = await db.auth.getUser();
    if (!user) return;

    // À ADAPTER si votre table de profils porte un autre nom
    const { data: profil } = await db.from('profils').select('role').eq('id', user.id).single();
    monRole = profil ? profil.role : null;

    document.getElementById('qui').textContent = user.email;
    document.getElementById('role').textContent = monRole || 'aucun rôle';
    document.getElementById('vue-connexion').style.display = 'none';
    document.getElementById('vue-app').style.display = 'block';
    charger();
  }

  // ---------- Création ----------
  async function creer() {
    const titre = document.getElementById('titre').value.trim();
    if (!titre) { alert('Le titre est obligatoire'); return; }
    const { error } = await db.from('interventions').insert({
      titre: titre,
      description: document.getElementById('description').value,
      lieu: document.getElementById('lieu').value,
      priorite: document.getElementById('priorite').value
    });
    if (error) { alert(error.message); return; }
    document.getElementById('titre').value = '';
    document.getElementById('description').value = '';
    document.getElementById('lieu').value = '';
    document.getElementById('priorite').value = 'normale';
    charger();
  }

  // ---------- Liste ----------
  async function charger() {
    const { data, error } = await db.from('interventions')
      .select('*').order('created_at', { ascending: false });
    const tbody = document.getElementById('liste');
    if (error) { tbody.innerHTML = '<tr><td colspan="5" class="erreur">' + esc(error.message) + '</td></tr>'; return; }
    if (!data.length) { tbody.innerHTML = '<tr><td colspan="5">Aucune demande.</td></tr>'; return; }

    tbody.innerHTML = '';
    data.forEach(i => {
      const tr = document.createElement('tr');
      tr.className = 'ligne';
      tr.onclick = () => { ouvert = (ouvert === i.id ? null : i.id); charger(); };
      tr.innerHTML =
        '<td>' + esc(i.titre) + '</td>' +
        '<td>' + esc(i.lieu) + '</td>' +
        '<td>' + esc(i.priorite) + '</td>' +
        '<td><span class="badge ' + i.statut + '">' + (LIBELLES[i.statut] || esc(i.statut)) + '</span></td>' +
        '<td>' + new Date(i.created_at).toLocaleDateString('fr-FR') + '</td>';
      tbody.appendChild(tr);

      if (ouvert === i.id) tbody.appendChild(ligneDetail(i));
    });
  }

  // ---------- Détail + actions ----------
  function ligneDetail(i) {
    const tr = document.createElement('tr');
    tr.className = 'detail';
    let html = '<td colspan="5">';
    html += '<strong>Description :</strong><br>' + (esc(i.description).replace(/\n/g, '<br>') || '<em>Aucune description</em>');
    if (i.affectation) html += '<br><br><strong>Affectation :</strong> ' + (i.affectation === 'batiment' ? 'Service bâtiment' : 'Régie');
    if (i.statut === 'refusee' && i.motif_refus) html += '<br><br><strong>Motif du refus :</strong> ' + esc(i.motif_refus);
    html += '<div style="margin-top:10px">' + actions(i) + '</div></td>';
    tr.innerHTML = html;
    return tr;
  }

  function actions(i) {
    const peutGerer = monRole === 'admin' || monRole === 'regie' ||
                      (monRole === 'batiment' && i.affectation === 'batiment');
    if (!peutGerer) return '';
    let b = '';
    if (i.statut === 'a_affecter' && (monRole === 'admin' || monRole === 'regie')) {
      b += '<button onclick="accepter(\'' + i.id + '\')">Accepter (régie)</button>';
      b += '<button onclick="transferer(\'' + i.id + '\')">Transférer au bâtiment</button>';
      b += '<button onclick="refuser(\'' + i.id + '\')">Refuser</button>';
    }
    if (i.statut === 'a_traiter') {
      b += '<button onclick="changerStatut(\'' + i.id + '\',\'en_cours\')">Prendre en charge</button>';
      if (monRole !== 'batiment') b += '<button onclick="transferer(\'' + i.id + '\')">Transférer au bâtiment</button>';
    }
    if (i.statut === 'en_cours') {
      b += '<button onclick="changerStatut(\'' + i.id + '\',\'termine\')">Terminer</button>';
    }
    return b;
  }

  async function maj(id, champs) {
    const { error } = await db.from('interventions').update(champs).eq('id', id);
    if (error) { alert(error.message); return; }
    charger();
  }

  function accepter(id)   { maj(id, { statut: 'a_traiter', affectation: 'regie' }); }
  function transferer(id) { maj(id, { statut: 'a_traiter', affectation: 'batiment' }); }
  function changerStatut(id, statut) { maj(id, { statut: statut }); }
  function refuser(id) {
    const motif = prompt('Motif du refus (visible par le demandeur) :');
    if (motif === null) return;
    maj(id, { statut: 'refusee', motif_refus: motif, date_refus: new Date().toISOString() });
  }

  // Reprise de session au chargement de la page
  db.auth.getSession().then(({ data }) => { if (data.session) demarrer(); });
</script>
</body>
</html>
