<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travaux et maintenance</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; padding: 0 10px; }
    input, select, textarea, button { display: block; margin: 6px 0; padding: 8px; width: 100%; box-sizing: border-box; }
    button { cursor: pointer; width: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: left; }
    tbody tr.ligne { cursor: pointer; }
    tbody tr.ligne:hover { background: #f0f6ff; }
    .erreur { color: red; }
    #fond-detail { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 10; }
    #boite-detail { background: #fff; padding: 20px; border-radius: 8px; max-width: 550px;
      width: 90%; max-height: 85vh; overflow-y: auto; }
    #boite-detail p { margin: 8px 0; }
    #detail-descriptif { white-space: pre-wrap; background: #f6f6f6; padding: 10px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Demandes d'intervention</h1>

  <div id="vue-connexion">
    <h2>Connexion</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="mdp" placeholder="Mot de passe">
    <button onclick="connexion()">Se connecter</button>
    <p id="message" class="erreur"></p>
  </div>

  <div id="vue-appli" style="display:none">
    <button onclick="deconnexion()">Se déconnecter</button>

    <h2>Nouvelle demande</h2>
    <input type="text" id="titre" placeholder="Titre">
    <select id="lieu"></select>
    <select id="corps_etat"></select>
    <textarea id="descriptif" rows="4" placeholder="Décrivez le problème rencontré"></textarea>
    <select id="priorite">
      <option value="basse">Basse</option>
      <option value="normale" selected>Normale</option>
      <option value="haute">Haute</option>
    </select>
    <button onclick="creer()">Créer la demande</button>

    <h2>Liste des demandes</h2>
    <p><small>Cliquez sur une ligne pour voir le détail.</small></p>
    <table>
      <thead>
        <tr><th>Titre</th><th>Lieu</th><th>Corps d'état</th><th>Priorité</th><th>Statut</th></tr>
      </thead>
      <tbody id="liste"></tbody>
    </table>
  </div>

  <div id="fond-detail" onclick="fermerDetail()">
    <div id="boite-detail" onclick="event.stopPropagation()">
      <h2 id="detail-titre"></h2>
      <p><strong>Lieu :</strong> <span id="detail-lieu"></span></p>
      <p><strong>Corps d'état :</strong> <span id="detail-corps"></span></p>
      <p><strong>Priorité :</strong> <span id="detail-priorite"></span></p>
      <p><strong>Statut :</strong> <span id="detail-statut"></span></p>
      <p><strong>Créée le :</strong> <span id="detail-date"></span></p>
      <p><strong>Descriptif :</strong></p>
      <div id="detail-descriptif"></div>
      <button onclick="fermerDetail()">Fermer</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://iflehvsemyyyofkwpezv.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_TupRcFtwtofGhLlz8hwVxg_O8xAQzTx';

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Listes prédéfinies : modifiez les valeurs selon votre établissement
    const LIEUX = [
      'Bâtiment A',
      'Bâtiment B',
      'Extérieurs',
      'Parking',
      'Local technique'
    ];

    const CORPS_ETAT = [
      'Électricité',
      'Plomberie',
      'Chauffage / Ventilation',
      'Menuiserie',
      'Serrurerie',
      'Peinture',
      'Espaces verts',
      'Autre'
    ];

    function remplirListes() {
      const selLieu = document.getElementById('lieu');
      const selCorps = document.getElementById('corps_etat');
      selLieu.innerHTML = '<option value="">-- Choisir un lieu --</option>';
      selCorps.innerHTML = '<option value="">-- Choisir un corps d\'état --</option>';
      LIEUX.forEach(function (l) {
        const o = document.createElement('option');
        o.value = l; o.textContent = l;
        selLieu.appendChild(o);
      });
      CORPS_ETAT.forEach(function (c) {
        const o = document.createElement('option');
        o.value = c; o.textContent = c;
        selCorps.appendChild(o);
      });
    }

    async function connexion() {
      const email = document.getElementById('email').value;
      const mdp = document.getElementById('mdp').value;
      const { error } = await db.auth.signInWithPassword({ email: email, password: mdp });
      if (error) {
        document.getElementById('message').textContent = error.message;
      } else {
        document.getElementById('message').textContent = '';
        majVue();
      }
    }

    async function deconnexion() {
      await db.auth.signOut();
      majVue();
    }

    async function creer() {
      const titre = document.getElementById('titre').value.trim();
      const lieu = document.getElementById('lieu').value;
      const corps = document.getElementById('corps_etat').value;
      const descriptif = document.getElementById('descriptif').value.trim();

      if (!titre) { alert('Le titre est obligatoire'); return; }
      if (!lieu) { alert('Veuillez choisir un lieu'); return; }
      if (!corps) { alert('Veuillez choisir un corps d\'état'); return; }
      if (!descriptif) { alert('Le descriptif du problème est obligatoire'); return; }

      const { error } = await db.from('interventions').insert({
        titre: titre,
        lieu: lieu,
        corps_etat: corps,
        descriptif: descriptif,
        priorite: document.getElementById('priorite').value
      });
      if (error) { alert(error.message); return; }

      document.getElementById('titre').value = '';
      document.getElementById('lieu').value = '';
      document.getElementById('corps_etat').value = '';
      document.getElementById('descriptif').value = '';
      document.getElementById('priorite').value = 'normale';
      charger();
    }

    async function changerStatut(id, statut) {
      const { error } = await db.from('interventions').update({ statut: statut }).eq('id', id);
      if (error) { alert(error.message); }
    }

    function afficherDetail(i) {
      document.getElementById('detail-titre').textContent = i.titre || '';
      document.getElementById('detail-lieu').textContent = i.lieu || '';
      document.getElementById('detail-corps').textContent = i.corps_etat || '';
      document.getElementById('detail-priorite').textContent = i.priorite || '';
      document.getElementById('detail-statut').textContent = (i.statut || '').replace('_', ' ');
      document.getElementById('detail-date').textContent =
        i.created_at ? new Date(i.created_at).toLocaleString('fr-FR') : '';
      // Anciennes demandes : on retombe sur l'ancien champ description s'il existe
      document.getElementById('detail-descriptif').textContent =
        i.descriptif || i.description || '(aucun descriptif)';
      document.getElementById('fond-detail').style.display = 'flex';
    }

    function fermerDetail() {
      document.getElementById('fond-detail').style.display = 'none';
    }

    async function charger() {
      const { data, error } = await db.from('interventions').select('*').order('created_at', { ascending: false });
      if (error) { alert(error.message); return; }
      const liste = document.getElementById('liste');
      liste.innerHTML = '';
      data.forEach(function (i) {
        const tr = document.createElement('tr');
        tr.className = 'ligne';
        tr.innerHTML =
          '<td>' + echapper(i.titre) + '</td>' +
          '<td>' + echapper(i.lieu || '') + '</td>' +
          '<td>' + echapper(i.corps_etat || '') + '</td>' +
          '<td>' + echapper(i.priorite) + '</td>' +
          '<td></td>';
        const select = document.createElement('select');
        ['a_traiter', 'en_cours', 'termine'].forEach(function (s) {
          const opt = document.createElement('option');
          opt.value = s;
          opt.textContent = s.replace('_', ' ');
          if (s === i.statut) opt.selected = true;
          select.appendChild(opt);
        });
        select.onclick = function (e) { e.stopPropagation(); };
        select.onchange = function () { changerStatut(i.id, select.value); };
        tr.lastChild.appendChild(select);
        tr.onclick = function () { afficherDetail(i); };
        liste.appendChild(tr);
      });
    }

    function echapper(texte) {
      const div = document.createElement('div');
      div.textContent = texte;
      return div.innerHTML;
    }

    async function majVue() {
      const { data } = await db.auth.getSession();
      const connecte = data.session !== null;
      document.getElementById('vue-connexion').style.display = connecte ? 'none' : 'block';
      document.getElementById('vue-appli').style.display = connecte ? 'block' : 'none';
      if (connecte) { charger(); }
    }

    db.channel('interventions-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'interventions' }, function () { charger(); })
      .subscribe();

    remplirListes();
    majVue();
  </script>
</body>
</html>
